    rules_version = '2';

      match /databases/{database}/documents {

 6. Save this file as  public/index.html  then run:

<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STAN KELLS DIGITALS</title>
<style>
:root{--sea:#0b7ea6;--sea2:#095f7d;--pink:#ec4899;--bg:#fff;--soft:#eef8fc;--tx:#12303b;--bd:#cfe6ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1f26;--soft:#13303b;--tx:#e8f6fb;--bd:#24505f}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:linear-gradient(90deg,var(--sea),var(--sea2));color:#fff;padding:14px 16px;border-bottom:4px solid var(--pink)}
header h1{margin:0;font-size:1.3rem;letter-spacing:1px}header small{opacity:.9}
nav{display:flex;gap:6px;padding:10px;overflow-x:auto;background:var(--soft);position:sticky;top:0;z-index:5}
nav button{padding:9px 14px;border-radius:20px;background:var(--bg);color:var(--sea);font-weight:600;cursor:pointer;border:1px solid var(--bd);white-space:nowrap}
nav button.on{background:var(--pink);color:#fff;border-color:var(--pink)}
main{max-width:980px;margin:auto;padding:14px}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;color:var(--sea);font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--soft);border-left:5px solid var(--pink);padding:12px;border-radius:8px}.stat b{display:block;font-size:1.3rem;color:var(--sea)}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:1rem}
label{font-size:.8rem;font-weight:600;color:var(--sea);display:block;margin:6px 0 2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.btn{background:var(--sea);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:10px}.btn.p{background:var(--pink)}.btn.s{padding:5px 10px;margin:0;font-size:.8rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}th{background:var(--sea);color:#fff;text-align:left;padding:8px}td{padding:8px;border-bottom:1px solid var(--bd)}
.tag{padding:2px 8px;border-radius:10px;font-size:.75rem;font-weight:700;color:#fff;background:var(--sea)}.tag.r{background:var(--pink)}
footer{text-align:center;padding:16px;font-size:.85rem;color:var(--sea);border-top:4px solid var(--pink)}
.line{display:grid;grid-template-columns:3fr 1fr auto;gap:6px;margin-bottom:6px}
.warn{background:var(--pink);color:#fff;padding:10px 14px;text-align:center}.ok{background:var(--soft);color:var(--sea);padding:4px;text-align:center;font-size:.8rem}
.debt{border:1px solid var(--pink);border-radius:10px;padding:12px;margin-bottom:10px}
</style></head><body>
<header><h1>STAN KELLS DIGITALS</h1><small>Electronics • CCTV & Security • Appliances • Cables &nbsp;|&nbsp; Tel: 0548492347</small></header>
<div id="st" class="ok">Connecting…</div>
<nav id="nav"></nav><main id="app"></main>
<footer>© STAN KELLS DIGITALS • 0548492347<br>Developed by <b>SOMEFOST SOLUTIONS</b></footer>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=n=>'GH₵ '+(+n).toFixed(2), today=()=>new Date().toISOString().slice(0,10);
let db=null,S=[],C=[],SA=[],tab='Dashboard',lines=[{}],F={cid:'',paid:0,due:'',pick:''},dirty=false;
const tabs=['Dashboard','New Sale','Repay Debt','Credits','Customers','Stock'];
$('#nav').innerHTML=tabs.map(t=>`<button data-t="${t}">${t}</button>`).join('');
$('#nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};
const bal=s=>s.total-(s.payments||[]).reduce((a,p)=>a+p.amt,0);
const cust=id=>C.find(c=>c.id==id)||{name:'(deleted)',phone:''};
const owes=id=>SA.filter(s=>s.cid==id).reduce((a,s)=>a+Math.max(0,bal(s)),0);
const col=n=>db.collection(n);
function render(){
 dirty=false;
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 if(!db){$('#app').innerHTML='<div class="warn">Please log in to continue.</div>';return}
 $('#app').innerHTML=({Dashboard:dash,'New Sale':sale,'Repay Debt':repay,Credits:credits,Customers:custs,Stock:stockV})[tab]();
}
function soft(){ // re-render without wiping what someone is typing
 const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)){dirty=true}else render()}
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(dirty&&!(a&&/INPUT|SELECT/.test(a.tagName)))render()},250));
function dash(){
 const out=SA.reduce((a,s)=>a+Math.max(0,bal(s)),0),tot=SA.reduce((a,s)=>a+s.total,0),low=S.filter(i=>i.qty<=5);
 const od=SA.filter(s=>bal(s)>0&&s.due&&s.due<today()),owing=C.filter(c=>owes(c.id)>0);
 return `<div class="grid"><div class="stat">Customers<b>${C.length}</b></div><div class="stat">Total Sales<b>${M(tot)}</b></div><div class="stat">Customers Owing<b>${owing.length}</b></div><div class="stat">Outstanding Credit<b>${M(out)}</b></div><div class="stat">Overdue<b>${od.length}</b></div><div class="stat">Low Stock<b>${low.length}</b></div></div>
 <div class="card" style="margin-top:14px"><h2>Low stock (5 or fewer)</h2>${low.length?low.map(i=>`<span class="tag r">${esc(i.name)}: ${i.qty}</span> `).join(''):'All items well stocked.'}</div>
 <div class="card"><h2>Overdue payments</h2>${od.length?od.map(s=>`${esc(cust(s.cid).name)} (${esc(cust(s.cid).phone)}) owes <b>${M(bal(s))}</b>, was due ${s.due}<br>`).join(''):'None.'}</div>`;
}
function sale(){
 const opts=S.map(i=>`<option value="${i.id}">${esc(i.name)} — ${M(i.price)} (${i.qty} in stock)</option>`).join('');
 return `<div class="card"><h2>New Sale / Credit</h2>
 <label>Customer</label><select onchange="F.cid=this.value"><option value="">-- select customer --</option>${C.map(c=>`<option value="${c.id}" ${F.cid==c.id?'selected':''}>${esc(c.name)} (${esc(c.phone)})</option>`).join('')}</select>
 <label>Items bought</label>${lines.map((l,i)=>`<div class="line"><select onchange="lines[${i}].id=this.value"><option value="">-- item --</option>${opts.replace(`value="${l.id}"`,`value="${l.id}" selected`)}</select><input type="number" min="1" value="${l.q||1}" onchange="lines[${i}].q=+this.value"><button class="btn s p" onclick="lines.splice(${i},1);if(!lines.length)lines=[{}];render()">✕</button></div>`).join('')}
 <button class="btn s" onclick="lines.push({});render()">+ Add item</button>
 <div class="row"><div><label>Amount paid now (GH₵)</label><input type="number" min="0" value="${F.paid}" onchange="F.paid=+this.value"></div><div><label>Estimated payment date (for balance)</label><input type="date" value="${F.due}" onchange="F.due=this.value"></div></div>
 <button class="btn p" onclick="doSale()">Complete Sale</button></div>`;
}
async function doSale(){
 if(!F.cid)return alert('Select a customer (add one in Customers tab).');
 const items=[];let total=0;
 for(const l of lines){if(!l.id)continue;const it=S.find(i=>i.id==l.id),q=l.q||1;
  if(!it)continue;if(q>it.qty)return alert('Not enough stock for '+it.name);items.push({id:it.id,name:it.name,q,price:it.price});total+=q*it.price}
 if(!items.length)return alert('Add at least one item.');
 const paid=Math.min(F.paid||0,total);
 if(paid<total&&!F.due)return alert('Set the estimated payment date for the balance.');
 try{
  await col('sales').add({ts:Date.now(),date:today(),cid:F.cid,items,total,payments:paid?[{date:today(),amt:paid}]:[],due:paid<total?F.due:''});
  for(const x of items){const it=S.find(i=>i.id==x.id);await col('stock').doc(x.id).update({qty:Math.max(0,it.qty-x.q)})}
  lines=[{}];F={cid:'',paid:0,due:'',pick:''};tab='Credits';render();
 }catch(e){alert('Could not save: '+(e.message||e.code))}
}
function repay(){
 const owing=C.filter(c=>owes(c.id)>0).sort((a,b)=>owes(b.id)-owes(a.id));
 return `<div class="card"><h2>Customer Repays Debt</h2><p>Payments are applied to the oldest debt first. When a customer's balance reaches zero they are automatically removed from this list and marked Cleared.</p>
 ${owing.map(c=>{const sl=SA.filter(s=>s.cid==c.id&&bal(s)>0).sort((a,b)=>a.ts-b.ts),o=owes(c.id);
  return `<div class="debt"><b>${esc(c.name)}</b> • ${esc(c.phone)} • ${esc(c.loc)}<br>Owes <b style="color:var(--pink)">${M(o)}</b> across ${sl.length} sale(s)${sl[0]&&sl[0].due?`, next due ${sl[0].due}`:''}
  <div class="row"><div><label>Amount repaid (GH₵)</label><input type="number" min="0" id="a_${c.id}"></div><div><label>New est. date for what remains</label><input type="date" id="d_${c.id}"></div></div>
  <button class="btn p" onclick="doRepay('${c.id}')">Record Repayment</button> <button class="btn" onclick="document.getElementById('a_${c.id}').value=${o};doRepay('${c.id}')">Pay in full</button></div>`}).join('')||'<b>No customer is owing. 🎉</b>'}</div>`;
}
async function doRepay(cid){
 let a=+document.getElementById('a_'+cid).value;const nd=document.getElementById('d_'+cid).value,tot=owes(cid);
 if(!a||a<=0)return alert('Enter the amount repaid.');
 if(a>tot)a=tot;
 try{
  for(const s of SA.filter(s=>s.cid==cid&&bal(s)>0).sort((x,y)=>x.ts-y.ts)){
   if(a<=0)break;const p=Math.min(a,bal(s));a-=p;
   const payments=[...(s.payments||[]),{date:today(),amt:p}],left=bal(s)-p;
   await col('sales').doc(s.id).update({payments,due:left>0?(nd||s.due):''});
  }
  alert(owes(cid)>0?'Repayment recorded.':'Debt fully repaid — customer cleared!');
 }catch(e){alert('Could not save: '+(e.message||e.code))}
}
function credits(){
 const rows=[...SA].sort((a,b)=>b.ts-a.ts).map(s=>{const b=bal(s),od=b>0&&s.due&&s.due<today(),c=cust(s.cid);
  return `<tr><td>${s.date}</td><td>${esc(c.name)}<br><small>${esc(c.phone)}</small></td><td>${(s.items||[]).map(i=>esc(i.name)+' ×'+i.q).join('<br>')}</td><td>${M(s.total)}</td><td>${M(s.total-b)}<br><small>${(s.payments||[]).map(p=>p.date+': '+M(p.amt)).join('<br>')}</small></td><td><b>${M(b)}</b></td><td>${b>0?s.due:''}</td><td>${b<=0?'<span class="tag">Paid</span>':od?'<span class="tag r">Overdue</span>':'<span class="tag r" style="opacity:.7">Owing</span>'}</td></tr>`}).join('');
 return `<div class="card"><h2>Sales, Credits & Payment History</h2><div class="tw"><table><tr><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Paid</th><th>Balance</th><th>Est. pay date</th><th>Status</th></tr>${rows||'<tr><td colspan="8">No sales yet.</td></tr>'}</table></div></div>`;
}
function custs(){
 return `<div class="card"><h2>Add Customer</h2><div class="row"><div><label>Name</label><input id="cn"></div><div><label>Phone number</label><input id="cp" type="tel"></div><div><label>Location</label><input id="cl"></div></div><button class="btn p" onclick="addC()">Save Customer</button></div>
 <div class="card"><h2>Customers</h2><div class="tw"><table><tr><th>Name</th><th>Phone</th><th>Location</th><th>Owes</th><th>Status</th></tr>${[...C].sort((a,b)=>owes(b.id)-owes(a.id)).map(c=>{const o=owes(c.id);return `<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.loc)}</td><td>${M(o)}</td><td>${o>0?'<span class="tag r">Owing</span>':'<span class="tag">Cleared</span>'}</td></tr>`}).join('')||'<tr><td colspan="5">No customers yet.</td></tr>'}</table></div></div>`;
}
async function addC(){const n=$('#cn').value.trim(),p=$('#cp').value.trim(),l=$('#cl').value.trim();if(!n||!p)return alert('Name and phone are required.');
 try{await col('customers').add({name:n,phone:p,loc:l,ts:Date.now()});$('#cn').value=$('#cp').value=$('#cl').value=''}catch(e){alert('Could not save: '+(e.message||e.code))}}
const SEED=[["CCTV Dome Camera 2MP","CCTV & Security",20,180],["CCTV Bullet Camera 5MP","CCTV & Security",15,260],["4-Channel DVR","CCTV & Security",8,420],["8-Channel NVR","CCTV & Security",6,780],["Hard Disk 1TB (Surveillance)","CCTV & Security",10,350],["BNC/DC Connectors (pair)","CCTV Accessories",80,6],["Camera Power Adapter 12V","CCTV Accessories",30,35],["CCTV Power Supply Box","CCTV Accessories",12,120],["Smart TV 43\"","Electronics",5,2100],["Home Theatre System","Electronics",4,950],["Phone Charger","Electronics",40,45],["Electric Standing Fan","Electrical Appliances",12,320],["Electric Iron","Electrical Appliances",15,110],["Blender","Electrical Appliances",10,180],["Electric Kettle","Electrical Appliances",14,95],["Cable 1.5mm (roll 100m)","Wiring & Cables",25,260],["Cable 2.5mm (roll 100m)","Wiring & Cables",20,390],["Cable 4mm (roll 100m)","Wiring & Cables",10,620],["Extension Socket","Wiring & Cables",35,55],["CAT6 Network Cable (305m)","Wiring & Cables",6,650]];
async function seed(){try{await Promise.all(SEED.map(a=>col('stock').add({name:a[0],cat:a[1],qty:a[2],price:a[3]})))}catch(e){alert('Could not save: '+(e.message||e.code))}}
function stockV(){
 const cats=["CCTV & Security","CCTV Accessories","Electronics","Electrical Appliances","Wiring & Cables"];
 return `${S.length?'':'<div class="card"><h2>Stock is empty</h2><button class="btn p" onclick="seed()">Load starter stock (CCTV, appliances, cables…)</button></div>'}
 <div class="card"><h2>Add Stock Item</h2><div class="row"><div><label>Item name</label><input id="in"></div><div><label>Category</label><select id="ic">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>Quantity</label><input id="iq" type="number" min="0"></div><div><label>Unit price (GH₵)</label><input id="ip" type="number" min="0"></div></div><button class="btn p" onclick="addI()">Add to Stock</button></div>
 <div class="card"><h2>Stock</h2><div class="tw"><table><tr><th>Item</th><th>Category</th><th>Price</th><th>Qty</th><th></th></tr>${[...S].sort((a,b)=>a.cat.localeCompare(b.cat)).map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.cat)}</td><td>${M(i.price)}</td><td>${i.qty<=5?`<span class="tag r">${i.qty} low</span>`:i.qty}</td><td><button class="btn s" onclick="restock('${i.id}')">Restock</button></td></tr>`).join('')}</table></div></div>`;
}
async function addI(){const n=$('#in').value.trim(),q=+$('#iq').value,p=+$('#ip').value;if(!n||!p)return alert('Name and price required.');
 try{await col('stock').add({name:n,cat:$('#ic').value,qty:q||0,price:p})}catch(e){alert('Could not save: '+(e.message||e.code))}}
async function restock(id){const q=+prompt('Quantity to add:');if(q>0){const it=S.find(i=>i.id==id);try{await col('stock').doc(id).update({qty:it.qty+q})}catch(e){alert('Could not save')}}}
const rows=snap=>snap.docs.map(d=>({id:d.id,...d.data()}));
window.start=function(adapter){
 db=adapter;
 $('#st').innerHTML='● Live: shared across all devices &nbsp; <a href="#" onclick="window.logout();return false">Log out</a>';
 const err=e=>{$('#st').textContent='Sync problem: '+(e&&e.message||'')};
 col('stock').onSnapshot(s=>{S=rows(s);soft()},err);
 col('customers').onSnapshot(s=>{C=rows(s);soft()},err);
 col('sales').onSnapshot(s=>{SA=rows(s);soft()},err);
 render();
};
render();
</script>
<div id="login" style="position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px">
 <div class="card" style="max-width:360px;width:100%;text-align:center"><h2>STAN KELLS DIGITALS</h2><p>Staff login</p>
 <input id="em" type="text" placeholder="Username" autocapitalize="none" autocomplete="username"><br><br><input id="pw" type="password" placeholder="Password" autocomplete="current-password">
 <button class="btn p" id="lg" style="width:100%">Log in</button><p id="le" style="color:var(--pink)"></p><small>Developed by SOMEFOST SOLUTIONS</small></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,persistentLocalCache,collection,doc,addDoc,updateDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
// >>> PASTE YOUR FIREBASE CONFIG HERE (Firebase console > Project settings > Your apps > Web app) <<<
const firebaseConfig={ apiKey: "AIzaSyBckEwUfDdORZ7IPPiPXNqyC_EbZmucvbk",
  authDomain: "stan-kells-shop.firebaseapp.com",
  projectId: "stan-kells-shop",
  storageBucket: "stan-kells-shop.firebasestorage.app",
  messagingSenderId: "474291225893",
  appId: "1:474291225893:web:d47a9566537044f5f646cc",
  measurementId: "G-HYHK78Q613"};
const app=initializeApp(firebaseConfig),auth=getAuth(app);
const fs=initializeFirestore(app,{localCache:persistentLocalCache()});
const adapter={collection:n=>({
 add:d=>addDoc(collection(fs,n),d),
 doc:id=>({update:d=>updateDoc(doc(fs,n,id),d)}),
 onSnapshot:(f,e)=>onSnapshot(collection(fs,n),s=>f({docs:s.docs}),e)})};
window.logout=()=>signOut(auth).then(()=>location.reload());
const go=()=>signInWithEmailAndPassword(auth,document.getElementById('em').value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'')+'@stankells.app',document.getElementById('pw').value).catch(()=>{document.getElementById('le').textContent='Wrong username or password'});
document.getElementById('lg').onclick=go;
document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')go()};
let started=false;
onAuthStateChanged(auth,u=>{if(u){document.getElementById('login').style.display='none';if(!started){started=true;window.start(adapter)}}else document.getElementById('login').style.display='flex'});
</script></body></html>
