(function(){const s=document.documentElement.style;s.setProperty('--loginbg','url('+BG.Login+')');s.setProperty('--herobg','url('+BG.Hero+')')})();
let bgNow='';
function setBg(k){const el=document.getElementById('bg');if(!el||k===bgNow||!BG[k])return;bgNow=k;el.style.opacity=0;setTimeout(()=>{el.style.backgroundImage='url('+BG[k]+')';el.style.opacity=1},220)}
let db=null,S=[],C=[],SA=[],tab='Dashboard',lines=[{}],F={cid:'',paid:0,due:'',pick:''},dirty=false;
const tabs=['Dashboard','New Sale','Repay Debt','Credits','Customers','Stock'];
const ICON={Dashboard:'📊','New Sale':'🛒','Repay Debt':'💳',Credits:'📒',Customers:'👥',Stock:'📦'};
$('#nav').innerHTML=tabs.map(t=>`<button data-t="${t}"><i>${ICON[t]}</i><span>${t}</span></button>`).join('');
function go(t){try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}
function fabUpd(){$('#fab').classList.toggle('off',!['Dashboard','Credits','Customers'].includes(tab)||!db)}
(function(){try{const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,180,180);gr.addColorStop(0,'#0a7ea8');gr.addColorStop(1,'#ec4899');g.fillStyle=gr;g.fillRect(0,0,180,180);g.fillStyle='#fff';g.font='bold 78px system-ui,Arial';g.textAlign='center';g.textBaseline='middle';g.fillText('SK',90,96);document.getElementById('ati').href=c.toDataURL('image/png')}catch(e){}})();
function lab(){document.querySelectorAll('table').forEach(t=>{const hs=[...t.rows[0].cells].map(c=>c.textContent);[...t.rows].slice(1).forEach(r=>[...r.cells].forEach((c,i)=>c.dataset.l=hs[i]||''))})}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}tab=b.dataset.t;render();window.scrollTo({top:0,behavior:'smooth'})}};
const bal=s=>s.total-(s.payments||[]).reduce((a,p)=>a+p.amt,0);
const cust=id=>C.find(c=>c.id==id)||{name:'(deleted)',phone:''};
const owes=id=>SA.filter(s=>s.cid==id).reduce((a,s)=>a+Math.max(0,bal(s)),0);
const col=n=>db.collection(n);
function render(){
 dirty=false;
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 if(!db){$('#app').innerHTML='<div class="warn">Please log in to continue.</div>';return}
 $('#app').innerHTML=({Dashboard:dash,'New Sale':sale,'Repay Debt':repay,Credits:credits,Customers:custs,Stock:stockV})[tab]();lab();fabUpd();setBg(tab);
}
function soft(){ // re-render without wiping what someone is typing
 const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)){dirty=true}else render()}
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(dirty&&!(a&&/INPUT|SELECT/.test(a.tagName)))render()},250));
let lowOpen=false;
function lowCard(low){
 const L=[...low].sort((a,b)=>a.qty-b.qty||a.name.localeCompare(b.name)),row=i=>`<div class="lowrow"><span>${esc(i.name)}</span><span class="tag r">${i.qty<=0?'Out of stock':i.qty+' left'}</span></div>`;
 if(!L.length)return `<div class="card" style="margin-top:14px"><h2>Low stock</h2>All items well stocked. ✅</div>`;
 const rest=L.slice(5);
 return `<div class="card" style="margin-top:14px"><h2>Low stock <small style="color:var(--mut);font-weight:600">(${L.length} item${L.length>1?'s':''}, lowest first)</small></h2>${L.slice(0,5).map(row).join('')}${rest.length?`<details class="more" ${lowOpen?'open':''} ontoggle="lowOpen=this.open"><summary>Show ${rest.length} more low-stock item${rest.length>1?'s':''}</summary>${rest.map(row).join('')}</details>`:''}</div>`;
}
function dash(){
 const out=SA.reduce((a,s)=>a+Math.max(0,bal(s)),0),tot=SA.reduce((a,s)=>a+s.total,0),low=S.filter(i=>i.qty<=5);
 const od=SA.filter(s=>bal(s)>0&&s.due&&s.due<today()),owing=C.filter(c=>owes(c.id)>0);
 const hr=new Date().getHours(),greet=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
 return `<div class="hero"><small>${greet} 👋 &nbsp;•&nbsp; ${new Date().toDateString()}</small><small style="margin-top:10px">Outstanding credit</small><div class="big">${M(out)}</div><div class="chips"><span>👥 ${owing.length} owing</span><span>⏰ ${od.length} overdue</span><span>📦 ${low.length} low stock</span></div></div>
 <div class="quick"><button onclick="go('New Sale')"><i>🛒</i>New Sale</button><button onclick="go('Repay Debt')"><i>💳</i>Repay</button><button onclick="go('Customers')"><i>👥</i>Customers</button><button onclick="go('Stock')"><i>📦</i>Stock</button></div>
 <div class="grid"><div class="stat">Customers<b>${C.length}</b></div><div class="stat">Total Sales<b>${M(tot)}</b></div><div class="stat">Customers Owing<b>${owing.length}</b></div><div class="stat">Outstanding Credit<b>${M(out)}</b></div><div class="stat">Overdue<b>${od.length}</b></div><div class="stat">Low Stock<b>${low.length}</b></div></div>
 ${lowCard(low)}
 <div class="card"><h2>Overdue payments</h2>${od.length?od.map(s=>`${esc(cust(s.cid).name)} (${esc(cust(s.cid).phone)}) owes <b>${M(bal(s))}</b>, was due ${s.due}<br>`).join(''):'None.'}</div>`;
}
function sale(){
 const opts=CATS.map(c=>{const L=S.filter(i=>i.cat===c).sort((a,b)=>a.name.localeCompare(b.name));return L.length?`<optgroup label="${c}">`+L.map(i=>`<option value="${i.id}">${esc(i.name)} — ${M(i.price)} (${i.qty} in stock)</option>`).join('')+'</optgroup>':''}).join('');
 return `<div class="card"><h2>New Sale / Credit</h2>
 <label>Customer</label><select onchange="F.cid=this.value"><option value="">-- select customer --</option>${C.map(c=>`<option value="${c.id}" ${F.cid==c.id?'selected':''}>${esc(c.name)} (${esc(c.phone)})</option>`).join('')}</select>
 <label>Items bought</label>${lines.map((l,i)=>`<div class="line"><select onchange="lines[${i}].id=this.value"><option value="">-- item --</option>${opts.replace(`value="${l.id}"`,`value="${l.id}" selected`)}</select><input type="number" min="1" value="${l.q||1}" onchange="lines[${i}].q=+this.value"><button class="btn s p" onclick="lines.splice(${i},1);if(!lines.length)lines=[{}];render()">✕</button></div>`).join('')}
 <button class="btn s" onclick="lines.push({});render()">+ Add item</button>
 <div class="row"><div><label>Amount paid now (GH₵)</label><input type="number" min="0" value="${F.paid}" onchange="F.paid=+this.value"></div><div><label>Estimated payment date (for balance)</label><input type="date" value="${F.due}" onchange="F.due=this.value"></div></div>
 <button class="btn p sticky-act" onclick="doSale()">Complete Sale</button></div>`;
}
async function doSale(){
 if(!F.cid)return alert('Select a customer (add one in Customers tab).');
 const items=[];let total=0;
 for(const l of lines){if(!l.id)continue;const it=S.find(i=>i.id==l.id),q=l.q||1;
  if(!it)continue;if(q>it.qty)return alert('Not enough stock for '+it.name);items.push({id:it.id,name:it.name,q,price:it.price});total+=q*it.price}
 if(!items.length)return alert('Add at least one item.');
 const paid=Math.min(F.paid||0,total);
 if(paid<total&&!F.due)return alert('Set the estimated payment date for the balance.');
 try{
  await col('sales').add({ts:Date.now(),date:today(),cid:F.cid,items,total,payments:paid?[{date:today(),amt:paid}]:[],due:paid<total?F.due:''});
  for(const x of items){const it=S.find(i=>i.id==x.id);await col('stock').doc(x.id).update({qty:Math.max(0,it.qty-x.q)})}
  lines=[{}];F={cid:'',paid:0,due:'',pick:''};tab='Credits';render();
 }catch(e){alert('Could not save: '+(e.message||e.code))}
}
function repay(){
 const owing=C.filter(c=>owes(c.id)>0).sort((a,b)=>owes(b.id)-owes(a.id));
 return `<div class="card"><h2>Customer Repays Debt</h2><p>Payments are applied to the oldest debt first. When a customer's balance reaches zero they are automatically removed from this list and marked Cleared.</p>
 ${owing.map(c=>{const sl=SA.filter(s=>s.cid==c.id&&bal(s)>0).sort((a,b)=>a.ts-b.ts),o=owes(c.id);
  return `<div class="debt"><b>${esc(c.name)}</b> • ${esc(c.phone)} • ${esc(c.loc)}<br>Owes <b style="color:var(--pink)">${M(o)}</b> across ${sl.length} sale(s)${sl[0]&&sl[0].due?`, next due ${sl[0].due}`:''}
  <div class="row"><div><label>Amount repaid (GH₵)</label><input type="number" min="0" id="a_${c.id}"></div><div><label>New est. date for what remains</label><input type="date" id="d_${c.id}"></div></div>
  <button class="btn p" onclick="doRepay('${c.id}')">Record Repayment</button> <button class="btn" onclick="document.getElementById('a_${c.id}').value=${o};doRepay('${c.id}')">Pay in full</button></div>`}).join('')||'<b>No customer is owing. 🎉</b>'}</div>`;
}
async function doRepay(cid){
 let a=+document.getElementById('a_'+cid).value;const nd=document.getElementById('d_'+cid).value,tot=owes(cid);
 if(!a||a<=0)return alert('Enter the amount repaid.');
 if(a>tot)a=tot;
 try{
  for(const s of SA.filter(s=>s.cid==cid&&bal(s)>0).sort((x,y)=>x.ts-y.ts)){
   if(a<=0)break;const p=Math.min(a,bal(s));a-=p;
   const payments=[...(s.payments||[]),{date:today(),amt:p}],left=bal(s)-p;
   await col('sales').doc(s.id).update({payments,due:left>0?(nd||s.due):''});
  }
  alert(owes(cid)>0?'Repayment recorded.':'Debt fully repaid — customer cleared!');
 }catch(e){alert('Could not save: '+(e.message||e.code))}
}

 try{

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,persistentLocalCache,collection,doc,addDoc,updateDoc,onSnapshot,getDoc,setDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
// >>> PASTE YOUR FIREBASE CONFIG HERE (Firebase console > Project settings > Your apps > Web app) <<<
const firebaseConfig={apiKey: "AIzaSyBckEwUfDdORZ7IPPiPXNqyC_EbZmucvbk",
  authDomain: "stan-kells-shop.firebaseapp.com",
  projectId: "stan-kells-shop",
  storageBucket: "stan-kells-shop.firebasestorage.app",
  messagingSenderId: "474291225893",
  appId: "1:474291225893:web:d47a9566537044f5f646cc",
  measurementId: "G-HYHK78Q613"};
// FIRST-TIME LOGIN (change it right after you log in):
const DEFAULT_USER="stankells", DEFAULT_PASS="SK-Digitals#4827";
const LOCAL=firebaseConfig.apiKey==="YOUR_API_KEY"; // config not pasted yet => local test mode
const app=LOCAL?null:initializeApp(firebaseConfig);
if(!LOCAL)try{signInAnonymously(getAuth(app)).catch(()=>{})}catch(e){} // silent; only needed if your rules require it
const fs=LOCAL?null:initializeFirestore(app,{localCache:persistentLocalCache()});
const fbAdapter={collection:n=>({
 add:d=>addDoc(collection(fs,n),d),
 doc:id=>({update:d=>updateDoc(doc(fs,n,id),d),delete:()=>deleteDoc(doc(fs,n,id)),set:d=>setDoc(doc(fs,n,id),d)}),
 onSnapshot:(f,e)=>onSnapshot(collection(fs,n),s=>f({docs:s.docs}),e)})};
const subs={},ld=n=>{try{return JSON.parse(localStorage.getItem('skd_'+n)||'{}')}catch(e){return {}}},sv=(n,m)=>{try{localStorage.setItem('skd_'+n,JSON.stringify(m))}catch(e){}};
const fire=n=>{const s={docs:Object.entries(ld(n)).map(([id,v])=>({id,data:()=>v}))};(subs[n]||[]).forEach(f=>f(s))};
const localAdapter={collection:n=>({
 add:async d=>{const m=ld(n);m['l'+Date.now()+Math.random().toString(36).slice(2,6)]=d;sv(n,m);fire(n)},
 doc:id=>({update:async d=>{const m=ld(n);Object.assign(m[id]||(m[id]={}),d);sv(n,m);fire(n)},delete:async()=>{const m=ld(n);delete m[id];sv(n,m);fire(n)},set:async d=>{const m=ld(n);m[id]=d;sv(n,m);fire(n)}}),
 onSnapshot:f=>{(subs[n]=subs[n]||[]).push(f);fire(n)}})};
const adapter=LOCAL?localAdapter:fbAdapter;
const setAdm=async o=>{if(LOCAL)localStorage.setItem('skd_admin',JSON.stringify(o));else await setDoc(doc(fs,'settings','admin'),o)};
const esc2=s=>String(s).replace(/[&<>"']/g,'');
const $$=id=>document.getElementById(id);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const getAdmin=async()=>{if(LOCAL){try{return JSON.parse(localStorage.getItem('skd_admin')||'null')}catch(e){return null}}const s=await Promise.race([getDoc(doc(fs,'settings','admin')),new Promise((_,x)=>setTimeout(()=>x(new Error('timeout')),8000))]);return s.exists()?s.data():null};
const mem=(k,v)=>{try{v===undefined?localStorage.removeItem(k):v===null?0:localStorage.setItem(k,v);return localStorage.getItem(k)}catch(e){return null}};
let started=false;
function enter(){$$('login').style.display='none';if(!started){started=true;window.start(adapter);if(LOCAL)$$('st').insertAdjacentHTML('afterbegin','<b>LOCAL TEST MODE (this browser only, not shared). Paste your Firebase config to share records.</b> &nbsp; ')}}
window.logout=()=>{mem('skd_ok',undefined);location.reload()};
window.changePw=async(force)=>{
 try{const a=await getAdmin();
  if(!force){const o=(prompt('Enter your CURRENT password:')||'').trim();if(!o)return;
   const okc=a?(await sha(a.salt+o))===a.hash:o===DEFAULT_PASS;if(!okc)return alert('Current password is wrong.')}
  const u=(prompt('Choose your username:',a?a.user:DEFAULT_USER)||'').trim().toLowerCase();if(!u)return;
  const n=(prompt('Choose a NEW password (at least 8 characters):')||'').trim();if(!n||n.length<8)return alert('Password must be at least 8 characters.');
  if(n!==(prompt('Type the new password again:')||'').trim())return alert('Passwords did not match.');
  const salt=crypto.randomUUID();
  await setAdm({user:u,salt,hash:await sha(salt+n)});
  mem('skd_ok',u);alert('Saved. Use the new username and password next time you log in.');
 }catch(e){alert('Could not save. Check your internet connection.')}};
const go=async()=>{
 const u=$$('em').value.trim().toLowerCase(),p=$$('pw').value.trim();$$('le').textContent='';
 try{const a=await getAdmin();let ok,first=false;
  if(!a){ok=u===DEFAULT_USER&&p===DEFAULT_PASS;first=ok}else ok=u===a.user&&(await sha(a.salt+p))===a.hash;
  if(!ok){$$('le').innerHTML='Wrong username or password.<br><small style="color:var(--tx)">Mode: '+(LOCAL?'LOCAL (saved in this browser only)':'Firebase project '+firebaseConfig.projectId)+'<br>'+(a?'A login was saved. Its username starts with "'+esc2(a.user.slice(0,2))+'"':'No custom login saved yet, so use the default one.')+'</small>';return}
  mem('skd_ok',u);enter();if(first)setTimeout(()=>window.changePw(true),400);
 }catch(e){$$('le').textContent='Cannot reach the database. Check internet and your Firebase config.'}};
$$('lg').onclick=go;$$('pw').onkeydown=e=>{if(e.key==='Enter')go()};
if(mem('skd_ok',null))enter();
</script></body></html>
